<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Zack&apos;s Maids</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/messages.css" />
</head>
<body class="messages-page">
  <nav class="site-nav" data-site-nav aria-label="Primary navigation">
    <div class="nav-auth">
      <span class="nav-auth-guest">
        <a class="nav-link" href="/login.html">Login</a>
        <span class="nav-sep" aria-hidden="true">|</span>
        <a class="nav-link" href="/register.html">Register</a>
      </span>
      <span class="nav-auth-user" hidden>
        <span class="nav-user-session">
          <img class="nav-user-icon-img" src="/user-svgrepo-com.svg" alt="" width="18" height="18" />
          <span class="nav-user-name" id="nav-user-display-name"></span>
          <span class="nav-sep" aria-hidden="true">|</span>
          <button type="button" class="nav-link nav-link-btn" id="nav-logout">Logout</button>
        </span>
      </span>
    </div>
    <ul class="nav-menu">
      <li><a class="nav-link" href="/demo.html">Home</a></li>
      <li class="nav-sep" aria-hidden="true">|</li>
      <li>
        <a class="nav-link" href="/bookings.html">Services</a>
      </li>
      <li class="nav-sep" data-requires-auth-any hidden aria-hidden="true">|</li>
      <li data-requires-auth-regular hidden>
        <a class="nav-link" href="/bookings.html">My Bookings</a>
      </li>
      <li data-requires-admin hidden>
        <a class="nav-link" href="/overview.html">All Bookings</a>
      </li>
      <li class="nav-sep" data-requires-admin hidden aria-hidden="true">|</li>
      <li data-requires-admin hidden>
        <a class="nav-link" href="/all-users.html">All users</a>
      </li>
      <li class="nav-sep" data-requires-admin hidden aria-hidden="true">|</li>
      <li data-requires-admin hidden>
        <a class="nav-link" href="/messages.html" aria-current="page">Messages</a>
      </li>
      <li class="nav-sep" data-requires-admin hidden aria-hidden="true">|</li>
      <li data-requires-admin hidden>
        <a class="nav-link" href="/admin-settings.html">Settings</a>
      </li>
      <li class="nav-sep" aria-hidden="true">|</li>
      <li><a class="nav-link" href="/about.html">About</a></li>
      <li class="nav-sep" aria-hidden="true">|</li>
      <li><a class="nav-link" href="/contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="messages-main">
    <p id="messages-loading">Checking access…</p>
    <div id="messages-layout" class="messages-layout" hidden>
      <aside id="messages-sidebar" class="messages-sidebar" aria-label="Messages">
        <div class="messages-sidebar-tabs" role="tablist" aria-label="Mailbox">
          <button
            type="button"
            class="messages-sidebar-tab is-active"
            role="tab"
            aria-selected="true"
            aria-controls="messages-sidebar-list"
            id="messages-tab-inbox"
            data-tab="inbox"
          >
            Inbox
          </button>
          <button
            type="button"
            class="messages-sidebar-tab"
            role="tab"
            aria-selected="false"
            aria-controls="messages-sidebar-list"
            id="messages-tab-sent"
            data-tab="sent"
          >
            Sent
          </button>
        </div>
        <p
          id="messages-delete-notice"
          class="messages-sidebar__delete-notice"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <div id="messages-sidebar-list" class="messages-sidebar-list"></div>
      </aside>
      <section id="messages-detail-inner" class="messages-detail" aria-label="Message detail">
        <p class="messages-detail__placeholder">Select a message.</p>
      </section>
    </div>
  </main>

  <script src="/auth-client.js" defer></script>
  <script src="/messages.js" defer></script>
</body>
</html>
